name: 每日一书 · 小红书笔记自动生成

on:
  schedule:
    # 北京时间 10:00 = UTC 02:00
    - cron: '0 2 * * *'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-note:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
      
      - name: 生成今日笔记
        run: python generate_note.py
        env:
          TZ: Asia/Shanghai
      
      - name: 提交并推送结果
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 添加所有变更
          git add output/ data/ README.md
          
          # 检查是否有变更
          if git diff --cached --quiet; then
            echo "没有变更需要提交"
            exit 0
          fi
          
          # 提交
          git commit -m "📚 每日笔记 - $(date +'%Y-%m-%d')"
          
          # 推送
          git push
